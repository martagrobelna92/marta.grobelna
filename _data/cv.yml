cv:
  name: Marta Grobelna
  headline: Doctoral Researcher, Algorithm Development and Optimization
  location: Munich, Germany
  email: marta.grobelna@tum.de
  website: https://www.marta-grobelna.com

  sections:
    Profile:
      - "Doctoral researcher at the Technical University of Munich developing algorithms for concurrent stochastic games and Markov decision processes with formal precision guarantees. I independently developed, proved correct, and implemented a novel value-iteration algorithm in the Java-based PRISM model checker, using linear and quadratic programming (AMPL, Gurobi) as core tools. At Fraunhofer IKS, I translated industry customers' goals (BMW, Huawei) into mathematical models and working prototypes, and I maintain and migrate a production Python web platform (Automata Tutor). Next, I want to bring this experience to industry and tackle challenging real-world problems."

    Experience:
      - company: Technical University of Munich (TUM)
        position: Doctoral Researcher, Algorithm Development
        location: Munich, Germany
        start_date: 2022-09
        end_date: present
        highlights:
          - Design algorithms for stochastic games and Markov decision processes (MDPs), combining mathematical analysis, correctness proofs, software implementation, and computational evaluation.
          - Independently designed, proved correct, and implemented in Java the first value-iteration algorithm for concurrent stochastic games with guaranteed precision for maximum-reachability objectives, and integrated it into the PRISM probabilistic model checker ([LICS 2025](https://arxiv.org/pdf/2505.21087)).
          - Formulated optimization problems arising from concurrent stochastic games in AMPL and solved them using Gurobi and other optimizers through the AMPL Java API.
          - Co-authored a paper on hot-starting and incremental value iteration for MDPs that reuses previous results when a model changes, with formal precision guarantees (under review).
          - Currently developing bounded strategy iteration and a new quadratic-programming formulation for concurrent stochastic games, and extending the methods to partially observable MDPs (POMDPs).

      - company: Fraunhofer Institute for Cognitive Systems (IKS)
        position: Research Associate, Applied R&D for Autonomous Systems
        location: Munich, Germany
        start_date: 2019-12
        end_date: 2022-08
        highlights:
          - "BMW project: worked directly with the customer to turn the question \"is this overtaking maneuver safe?\" into a precise mathematical problem (reachable-set computation from vehicle dynamics via flow-pipe construction, checking safety constraints specified in temporal logic for hybrid automata). Delivered a software prototype and was first author of the resulting EDCC 2021 paper."
          - "Huawei project: analyzed safety properties of sensor-fusion algorithms for autonomous driving and contributed to the white paper *Trustworthy AI for Intelligent Traffic Systems*."
          - Coordinated work packages, clarified customer requirements, and presented results to industry stakeholders.

      - company: RWTH Aachen University
        position: Student Assistant, Software and Verification Tools
        location: Aachen, Germany
        start_date: 2018-10
        end_date: 2019-08
        highlights:
          - Benchmarked verification tools and contributed C++ implementation and project documentation.

    Technical Skills:
      - label: Programming
        details: Python (primary), Java, C++, MATLAB
      - label: Optimization
        details: Linear programming (LP), quadratic programming (QP), AMPL, Gurobi and other solvers, hot-starting and incremental algorithms
      - label: Modeling
        details: Stochastic games, Markov decision processes (MDPs), value and strategy iteration
      - label: Engineering
        details: Git, CI/CD, pytest, Flask, MySQL, Docker, Linux, Bash, integration into existing codebases, automated testing, AI-assisted development (Claude Code)
      - label: Domain expertise
        details: Formal verification, probabilistic model checking, multi-agent systems, safety-critical autonomous systems, partially observable MDPs (POMDPs)

    Projects:
      - name: Automata Tutor
        url: https://automata-tutor.live-lab.fi.muni.cz
        start_date: 2022
        end_date: present
        summary: Web-based platform for automated assessment of exercises in automata theory (Python/Flask, MySQL, pytest, CI/CD).
        highlights:
          - Re-implemented the entire frontend in Python/Flask and migrated the database from H2 to MySQL, including a redesign of the SQL schema.
          - Built the automated test infrastructure (pytest fixtures, mock databases) within a collaborative Git and CI/CD workflow.
          - Currently guiding students through the migration of the backend.

